services:
  - type: web
    name: yummy-backend
    env: python
    region: ohio # Ou a região de sua preferência
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false